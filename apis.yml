aid: magicschool
name: MagicSchool
description: 'MagicSchool is an AI platform for K-12 education, used by schools and
  districts to save teachers time and personalize learning. It offers 80+ AI-powered
  teacher tools (lesson and unit planning, rubrics, IEP support, differentiation,
  assessment writing, communication) and 50+ student tools delivered through a moderated,
  student-safe AI assistant, alongside district-level administration with enterprise
  controls, data dashboards, and single sign-on. The platform emphasizes responsible
  AI and privacy for education, and integrates with the major classroom ecosystems
  (Google, Clever, Canvas, ClassLink, Schoology, Microsoft). MagicSchool is a Bain
  Capital Ventures portfolio company. No public developer API is offered at this time;
  this profile captures the company''s public web, trust, and security surface.'
